<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Hospital Appointment System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%); min-height:100vh;">

  <div class="auth-wrapper">
    <div class="auth-box">
      <a href="/" style="text-decoration:none;font-size:1.2rem;font-weight:700;color:#2563eb;">
        Hospital <span style="color:#10b981;">Appointment System</span>
      </a>

      <h2 style="margin-top:20px;">Welcome back</h2>
      <p class="subtitle">Sign in to manage your appointments</p>

      <!-- Alert message area -->
      <div id="alert" class="alert"></div>

      <!-- LOGIN FORM -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="doctor@hospital.com" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" />
      </div>

      <button class="btn btn-primary" style="width:100%;" id="loginBtn" onclick="handleLogin()">
        Sign In
      </button>

      <p style="text-align:center; margin-top:20px; color:var(--text-light); font-size:0.9rem;">
        Don't have an account? <a href="/register" style="color:var(--primary); font-weight:600;">Register</a>
      </p>

      <p style="text-align:center; margin-top:10px; font-size:0.82rem;">
        <a href="/help" style="color:var(--text-light);">Need test credentials? Visit the Help page</a>
      </p>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    // If already logged in, redirect to dashboard
    api.get('/api/auth/me').then(data => {
      if (data.loggedIn) window.location.href = '/dashboard';
    });

    async function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        return showAlert('alert', 'Please fill in all fields', 'error');
      }

      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        const data = await api.post('/api/auth/login', { email, password });
        showAlert('alert', `Welcome back, ${data.user.name}!`, 'success');
        setTimeout(() => { window.location.href = '/dashboard'; }, 1000);
      } catch (err) {
        showAlert('alert', err.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }

    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleLogin();
    });
  </script>
</body>
</html>
